[project]
name = "stayops-api"
version = "0.1.0"
description = "StayOps API — modular monolith for short-term rental operations"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142,<0.143",
    "uvicorn[standard]>=0.54,<0.55",
    "sqlalchemy>=2.1,<2.2",
    "alembic>=1.20,<1.21",
    "pydantic>=2.13,<2.14",
    "pydantic-settings>=2.15,<2.16",
    "email-validator>=2.3,<3",
    "psycopg[binary]>=3.3,<3.4",
    "pyjwt[crypto]>=2.15,<3",
    "httpx>=0.28,<0.29",
    "structlog>=26.1,<27",
    "redis>=8.1,<9",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "ruff>=0.16,<0.17",
    "mypy>=2.4,<3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "DTZ", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"migrations/**" = ["E501", "S608"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
